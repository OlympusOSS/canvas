<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Canvas — Design System</title>
		<script>
			// Decode the SPA fallback ?p= param produced by 404.html and restore
			// the original deep-link URL via history.replaceState BEFORE React
			// boots. This way react-router sees the right path on first render.
			(() => {
				var params = new URLSearchParams(window.location.search);
				var p = params.get("p");
				var basePath = "/canvas/";
				var target;
				if (p !== null) {
					target = basePath + p;
					window.history.replaceState(null, "", target);
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
