name: CI — Canvas

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc --noEmit

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@olympusoss'
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Make package public
        run: |
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/orgs/OlympusOSS/packages/npm/canvas" \
            -d '{"visibility":"public"}' || echo "Could not set package visibility — set manually in package settings"

  notify-downstream:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Athena rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GHCR_PAT }}
          repository: OlympusOSS/athena
          event-type: canvas-updated
          client-payload: '{"tag": "${{ github.ref_name }}"}'
      - name: Trigger Hera rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GHCR_PAT }}
          repository: OlympusOSS/hera
          event-type: canvas-updated
          client-payload: '{"tag": "${{ github.ref_name }}"}'
      - name: Trigger Site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GHCR_PAT }}
          repository: OlympusOSS/site
          event-type: canvas-updated
          client-payload: '{"tag": "${{ github.ref_name }}"}'
