name: CI — canvas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run vitest
        run: bun run test

      - name: Snapshot coverage gate (80%)
        run: bun run snapshot-coverage

      - name: Coverage
        run: bun run test:coverage

      - name: Bundle size
        run: bun run size
