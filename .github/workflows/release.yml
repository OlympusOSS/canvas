name: Release — canvas

# Changesets-powered release. On push to main:
#   1. If there are pending changesets, consume them locally (version bump +
#      CHANGELOG update), commit directly to main, and publish.
#   2. If no pending changesets, this workflow is a no-op.
#
# Avoids the PR-creation path entirely so it does not need the
# "Allow GitHub Actions to create and approve pull requests" repo setting.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Size check
        run: bun run size

      - name: Check for pending changesets
        id: has_changesets
        run: |
          # count .md files in .changeset/ that aren't README.md
          count=$(find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count pending changeset(s)."

      - name: Configure git
        if: steps.has_changesets.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version packages
        if: steps.has_changesets.outputs.count != '0'
        run: |
          bun run version-packages
          git add .
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore: version packages [skip ci]"
            git push origin HEAD:main
          fi

      - name: Authenticate npm
        if: steps.has_changesets.outputs.count != '0'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          echo "@olympusoss:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Publish to GitHub Packages
        if: steps.has_changesets.outputs.count != '0'
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release tags
        if: steps.has_changesets.outputs.count != '0'
        run: git push --tags

  # Docs build + Pages deploy. Runs after the release job so that the canvas
  # version baked into the bundle (via __CANVAS_VERSION__ in docs/vite.config.ts)
  # always matches the version that was just published. Single-source-of-truth:
  # docs.yml's push trigger is disabled so this is the only path that deploys
  # production docs.
  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Ensure we check out the version-bump commit that the release job
          # may have pushed, not the original push that triggered this run.
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install canvas deps (for type resolution)
        run: bun install --frozen-lockfile

      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: bun run build
        env:
          VITE_BASE_PATH: /canvas/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - uses: actions/deploy-pages@v4
        id: deployment
